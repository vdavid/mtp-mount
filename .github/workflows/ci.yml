name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfuse3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test

      - name: Build documentation
        run: cargo doc --no-deps

  # The MSRV promise covers what `cargo install mtp-mount` compiles: the library and both binaries. Tests and
  # dev-dependencies are ours alone, so they run on stable only. It resolves dependencies afresh the way a consumer on
  # the MSRV does, so the committed Cargo.lock (kept current by Renovate) never has to stay MSRV-compatible.
  msrv:
    name: Verify MSRV (1.91)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfuse3-dev

      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with rust-version in Cargo.toml and the justfile's `msrv` recipe.
          toolchain: "1.91"

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Resolve dependencies like a consumer on the MSRV
        # `fallback` makes the resolver pick the newest version whose rust-version fits ours.
        run: cargo update
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

      - name: Check compilation on MSRV (library and binaries)
        run: cargo check --lib --bins
        env:
          RUSTFLAGS: "-D warnings"

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfuse3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run FUSE integration tests
        run: cargo test --test integration -- --ignored --test-threads=1

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [check, msrv, integration]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "Some jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Some jobs were cancelled"
            exit 1
          fi
          echo "All jobs passed"
