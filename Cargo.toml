[package]
name = "mtp-mount"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Mount MTP devices as local filesystems via FUSE"
repository = "https://github.com/vdavid/mtp-mount"
keywords = ["mtp", "fuse", "mount", "android", "filesystem"]
categories = ["filesystem", "hardware-support"]
readme = "README.md"
exclude = [
    ".github/",
    "AGENTS.md",
    "docs/",
    "justfile",
    "deny.toml",
    "clippy.toml",
    "rustfmt.toml",
]

# Both binaries share the library in `src/lib.rs`: the CLI mounts one device on
# request, the daemon mounts every device it sees. Declared explicitly so the
# two names are visible here rather than inferred from the file layout.
[[bin]]
name = "mtp-mount"
path = "src/main.rs"

[[bin]]
name = "mtp-mountd"
path = "src/bin/mtp-mountd.rs"

[dependencies]
mtp-rs = { version = "0.32.0", features = ["virtual-device"] }
fuser = "0.18"
tokio = { version = "1.51", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
bytes = "1"
futures = "0.3"
libc = "0.2"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2.2"
